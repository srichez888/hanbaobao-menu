<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <g transform="translate(50,50)">
    <!-- Glass cup -->
    <path d="M-14,-18 L-12,16 Q-12,22 0,22 Q12,22 12,16 L14,-18 Z" fill="none" stroke="#fff" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- Liquid level -->
    <path d="M-13,-6 L13,-6" fill="none" stroke="#fff" stroke-width="1.5" opacity="0.5"/>
    <!-- Ice cubes -->
    <rect x="-6" y="2" width="8" height="6" rx="1" fill="none" stroke="#fff" stroke-width="1.5" opacity="0.7"/>
    <rect x="2" y="-4" width="6" height="5" rx="1" fill="none" stroke="#fff" stroke-width="1.5" opacity="0.7"/>
    <!-- Straw -->
    <line x1="6" y1="-18" x2="10" y2="-30" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>
    <!-- Lemon slice on rim -->
    <circle cx="-10" cy="-18" r="5" fill="none" stroke="#fff" stroke-width="1.5"/>
    <line x1="-12" y1="-18" x2="-8" y2="-18" stroke="#fff" stroke-width="1"/>
    <line x1="-10" y1="-20" x2="-10" y2="-16" stroke="#fff" stroke-width="1"/>
  </g>
</svg>