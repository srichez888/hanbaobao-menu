<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <circle cx="50" cy="50" r="48" fill="#F57F17"/>
  <g transform="translate(50,50)">
    <!-- Mason jar / specialty drink -->
    <rect x="-14" y="-16" width="28" height="34" rx="4" fill="none" stroke="#fff" stroke-width="2.5"/>
    <!-- Lid -->
    <rect x="-16" y="-18" width="32" height="5" rx="2" fill="none" stroke="#fff" stroke-width="2"/>
    <!-- Straw -->
    <line x1="4" y1="-18" x2="8" y2="-30" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>
    <!-- Liquid -->
    <path d="M-12,0 L12,0" fill="none" stroke="#fff" stroke-width="1.5" opacity="0.5"/>
    <!-- Lemon slice -->
    <circle cx="-4" cy="8" r="5" fill="none" stroke="#fff" stroke-width="1.5"/>
    <line x1="-6" y1="8" x2="-2" y2="8" stroke="#fff" stroke-width="1"/>
    <line x1="-4" y1="6" x2="-4" y2="10" stroke="#fff" stroke-width="1"/>
    <!-- Ginger piece -->
    <ellipse cx="6" cy="4" rx="4" ry="2.5" fill="none" stroke="#fff" stroke-width="1.5"/>
  </g>
</svg>