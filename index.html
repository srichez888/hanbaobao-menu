<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Hanbaobao — Menu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/handlebars@4.7.8/dist/handlebars.min.js"></script>
<style>
  @page {
    size: A4;
    margin: 0;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    background: #f5ede3;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  body {
    font-family: "Nunito Sans", sans-serif;
    color: #2D1A0E;
  }

  /* ── Reference panel (screen only) ── */
  .ref-toggle {
    position: fixed;
    bottom: 4mm;
    right: 4mm;
    z-index: 200;
    background: #5D4037;
    color: #fff;
    border: none;
    border-radius: 3mm;
    font-family: "Poppins", sans-serif;
    font-size: 8pt;
    font-weight: 600;
    padding: 2mm 4mm;
    cursor: pointer;
    box-shadow: 0 2px 6px rgba(0,0,0,.25);
  }

  .ref-panel {
    position: fixed;
    top: 0;
    right: 0;
    width: 50vw;
    height: 100vh;
    background: #222;
    z-index: 150;
    overflow-y: auto;
    display: none;
    box-shadow: -4px 0 16px rgba(0,0,0,.4);
  }

  .ref-panel.open { display: block; }

  .ref-panel img {
    width: 100%;
    display: block;
  }

  @media print {
    .ref-toggle, .ref-panel { display: none !important; }
  }

  /* ── Lang toggle ── */
  .lang-toggle {
    position: fixed;
    top: 4mm;
    right: 4mm;
    display: flex;
    z-index: 100;
    border: 1pt solid #8D6E63;
    border-radius: 3mm;
    overflow: hidden;
    box-shadow: 0 1px 4px rgba(0,0,0,.15);
  }

  .lang-toggle button {
    border: none;
    background: #fff;
    color: #5D4037;
    font-family: "Poppins", sans-serif;
    font-size: 8pt;
    font-weight: 600;
    padding: 1.5mm 3.5mm;
    cursor: pointer;
    letter-spacing: 0.5pt;
  }

  .lang-toggle button.active {
    background: #5D4037;
    color: #fff;
  }

  /* ── Page ── */
  .page {
    width: 210mm;
    min-height: 297mm;
    margin: 0 auto;
    padding: 7mm 7mm 6mm;
    background-image: url('images/bg.png');
    background-size: 210mm 297mm;
    background-repeat: no-repeat;
    background-position: top left;
  }

  .page + .page {
    margin-top: 8mm;
  }

  /* ── Header ── */
  .header {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4mm;
    margin-bottom: 5mm;
    padding-bottom: 3.5mm;
  }

  .header-logo {
    height: 2cm;
    width: auto;
    object-fit: contain;
  }

  .header-center {
    text-align: center;
  }

  .header-name-img {
    width: 5cm;
    object-fit: contain;
    display: block;
    margin: 0 auto;
  }

  .header-chinese {
    font-size: 10.5pt;
    font-weight: 700;
    color: #1A2C5B;
    letter-spacing: 5pt;
    display: block;
    margin-top: 0.5mm;
  }

  .header-title {
    font-family: "Dancing Script", cursive;
    font-size: 30pt;
    color: #1A2C5B;
    line-height: 1;
    margin-top: 1mm;
  }

  .header-tagline {
    font-size: 10pt;
    color: #7B5A4A;
    letter-spacing: 3pt;
    font-weight: 500;
    margin-top: 1.5mm;
    display: block;
  }

  /* ── Columns ── */
  .columns {
    display: flex;
    gap: 5mm;
    align-items: flex-start;
  }

  .column {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 4mm;
  }

  /* ── Card ── */
  .menu-card {
    border-radius: 32px;
    border: 1.5px solid var(--c, #8D6E63);
    background: #FCF5EECC;
    padding: 3mm 3.5mm 3.5mm;
    break-inside: avoid;
    page-break-inside: avoid;
  }

  .card-header {
    display: flex;
    align-items: center;
    gap: 2.5mm;
    margin-bottom: 3mm;
  }

  .card-icon {
    width: 9mm;
    height: 9mm;
    border-radius: 50%;
    object-fit: cover;
    border: 1.5px solid var(--c, #8D6E63);
    background: #fff;
    /* padding: 0.8mm; */
    flex-shrink: 0;
  }

  .card-header-text {
    flex: 1;
  }

  .card-title {
    font-size: 9.5pt;
    font-weight: 700;
    color: var(--c, #8D6E63);
    letter-spacing: 2pt;
    text-transform: uppercase;
    line-height: 1.2;
  }

  .card-subtitle {
    font-size: 5.5pt;
    color: #7B5A4A;
    letter-spacing: 0.3pt;
    font-style: italic;
    margin-top: 0.8mm;
    line-height: 1.3;
  }

  /* ── Item row ── */
  .item-row {
    display: flex;
    align-items: baseline;
    gap: 2mm;
    min-height: 0;
  }

  .item-group {
    margin-bottom: 2.5mm;
  }

  .item-group:last-child {
    margin-bottom: 0;
  }

  .item-name {
    font-size: 10pt;
    font-weight: 600;
    color: #2D1A0E;
    letter-spacing: 0.3pt;
    line-height: 1.3;
    flex-shrink: 0;
    max-width: 75%;
  }

  .item-dots {
    flex: 1;
    min-width: 3mm;
    border-bottom: 1.5px dotted #BBA99A;
    margin-bottom: 2px;
  }

  .item-price {
    font-size: 10pt;
    font-weight: 700;
    color: #2D1A0E;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .item-desc {
    font-size: 5.8pt;
    color: #8D6E63;
    font-style: italic;
    margin-top: 0.5mm;
    line-height: 1.35;
  }

  /* ── Card photos ── */
  .menu-card {
    position: relative;
    overflow: visible;
    z-index: 0;
  }

  .card-content {
    display: block;
  }

  .card-items {
    width: 100%;
  }

  .card-photos {
    position: absolute;
    top: -6mm;
    right: -6mm;
    display: flex;
    flex-direction: row;
    gap: 0.5mm;
    z-index: 1;
  }

  .card-photo {
    width: 20mm;
    height: 20mm;
    border-radius: 50%;
    object-fit: cover;
    border: none;
    box-shadow: none;
    /* border: 1.5px solid var(--c, #8D6E63); */
  }

  /* ── Spice note ── */
  .spice-note {
    text-align: center;
    margin-top: 5mm;
    font-size: 6pt;
    color: #7B5A4A;
    letter-spacing: 1pt;
    font-weight: 500;
  }

  .spice-icons {
    display: flex;
    justify-content: center;
    gap: 1mm;
    margin-top: 1.5mm;
    font-size: 8pt;
  }

  @media print {
    .lang-toggle { display: none; }
    html, body { background: transparent; margin: 0; padding: 0; }
    .page {
      width: 210mm;
      height: 297mm;
      margin: 0;
      background-size: 210mm 297mm;
      page-break-after: always;
    }
    .page + .page { margin-top: 0; }
    .page:last-child {
      page-break-after: auto;
    }
  }
</style>
</head>
<body>

<div class="lang-toggle">
  <button id="btn-fr" class="active" onclick="setLang('fr')">FR</button>
  <button id="btn-en" onclick="setLang('en')">EN</button>
  <button id="btn-cn" onclick="setLang('cn')">中文</button>
</div>

<script id="tpl-menu" type="text/x-handlebars-template">
{{#each pages}}
<div class="page">
  <div class="header">
    <img class="header-logo" src="images/logoImage.svg" alt="logo">
    <div class="header-center">
      <img class="header-name-img" src="images/logoText.svg" alt="HANBAOBAO">
      <span class="header-tagline">{{t ../tagline}}</span>
    </div>
  </div>

  <div class="columns">
    <div class="column">
      {{#each leftSections}}{{> card}}{{/each}}
    </div>
    <div class="column">
      {{#each rightSections}}{{> card}}{{/each}}
    </div>
  </div>

  {{#if spiceNote}}
  <div class="spice-note">
    {{t spiceNote}}
    <div class="spice-icons">🌶 &nbsp; 🌶🌶 &nbsp; 🌶🌶🌶</div>
  </div>
  {{/if}}
</div>
{{/each}}
</script>

<script id="tpl-card" type="text/x-handlebars-template">
<div class="menu-card" style="--c:{{color}}">
  <div class="card-header">
    {{#if icon}}<img class="card-icon" src="{{icon}}" alt="">{{/if}}
    <div class="card-header-text">
      <div class="card-title">{{t title}}</div>
      {{#if subtitle}}<div class="card-subtitle">{{t subtitle}}</div>{{/if}}
    </div>
  </div>
  <div class="card-content">
    <div class="card-items">
      {{#each items}}
      <div class="item-group">
        <div class="item-row">
          <div class="item-name">{{t name}}</div>
          <div class="item-dots"></div>
          <div class="item-price">{{price}}&nbsp;€</div>
        </div>
        {{#if description}}<div class="item-desc">{{t description}}</div>{{/if}}
      </div>
      {{/each}}
    </div>
    {{#if sectionImages}}
    <div class="card-photos">
      {{#each sectionImages}}
      <img class="card-photo" src="{{this}}" alt="">
      {{/each}}
    </div>
    {{/if}}
  </div>
</div>
</script>

<script>
(function() {
  var currentLang = 'fr';
  var menuData = null;

  Handlebars.registerHelper('t', function(obj) {
    if (typeof obj === 'string') return obj;
    if (!obj) return '';
    return obj[currentLang] || obj.fr || obj.cn || obj.en || '';
  });

  Handlebars.registerPartial('card', document.getElementById('tpl-card').innerHTML);
  var tpl = Handlebars.compile(document.getElementById('tpl-menu').innerHTML);

  function render() {
    var byPage = {};
    Object.keys(menuData.sections).forEach(function(key) {
      var s = Object.assign({ id: key }, menuData.sections[key]);
      var p = s.page || 1;
      if (!byPage[p]) byPage[p] = [];
      byPage[p].push(s);
    });
    var pages = Object.keys(byPage).map(Number).sort().map(function(p, i) {
      var left = [], right = [];
      byPage[p].forEach(function(s) {
        (s.column === 2 ? right : left).push(s);
      });
      left.sort(function(a, b) { return (a.rank || 0) - (b.rank || 0); });
      right.sort(function(a, b) { return (a.rank || 0) - (b.rank || 0); });
      return {
        leftSections: left,
        rightSections: right,
        spiceNote: i === 0 ? menuData.spiceNote : null
      };
    });
    document.getElementById('menu-output').innerHTML = tpl({
      pages: pages,
      tagline: menuData.tagline
    });
  }

  window.setLang = function(lang) {
    currentLang = lang;
    document.getElementById('btn-fr').className = lang === 'fr' ? 'active' : '';
    document.getElementById('btn-en').className = lang === 'en' ? 'active' : '';
    document.getElementById('btn-cn').className = lang === 'cn' ? 'active' : '';
    render();
  };

  fetch('menu.json')
    .then(function(r) { return r.json(); })
    .then(function(data) { menuData = data; render(); });
})();
</script>

<div id="menu-output"></div>

<div class="ref-panel" id="ref-panel">
  <img src="ex2.png" alt="Reference">
</div>
<button class="ref-toggle" onclick="document.getElementById('ref-panel').classList.toggle('open')">
  👁 Référence
</button>
</body>
</html>
