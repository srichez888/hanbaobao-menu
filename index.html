<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Hanbaobao — Menu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Nunito+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/handlebars@4.7.8/dist/handlebars.min.js"></script>
<style>
  @page {
    size: A4;
    margin: 0;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    background: #f5ede3;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  body {
    font-family: "Nunito Sans", sans-serif;
    color: #2D1A0E;
  }

  /* ── Page ── */
  .page {
    position: relative;
    width: 210mm;
    min-height: 297mm;
    margin: 0 auto;
    padding: 7mm 7mm 6mm;
    background-image: url('images/bg3.png');
    background-size: 210mm 297mm;
    background-repeat: no-repeat;
    background-position: top left;
  }

  .page + .page {
    margin-top: 8mm;
  }

  /* ── Header ── */
  .header {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4mm;
    padding-bottom: 3.5mm;
  }

  .header-logo {
    height: 2cm;
    width: auto;
    object-fit: contain;
  }

  .header-center {
    text-align: center;
  }

  .header-name-img {
    width: 5cm;
    object-fit: contain;
    display: block;
    margin: 0 auto;
  }

  .cn {
    font-family: "Noto Sans SC", sans-serif;
    font-size: 0.75em;
    color: #000000
  }

  .header-title {
    font-family: "Dancing Script", cursive;
    font-size: 30pt;
    color: #1A2C5B;
    line-height: 1;
    margin-top: 1mm;
  }

  .header-tagline {
    font-size: 10pt;
    color: #7B5A4A;
    letter-spacing: 3pt;
    font-weight: 500;
    margin-top: 1.5mm;
    display: block;
  }

  /* ── Columns ── */
  .columns {
    display: flex;
    gap: 2mm;
    align-items: flex-start;
  }

  .column {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 2mm;
  }

  /* ── Card ── */
  .menu-card {
    border-radius: 32px;
    border: 1.5px solid var(--c, #8D6E63);
    background: var(--card-bg, color-mix(in srgb, var(--c, #8D6E63) 5%, #FCF5EECC));
    padding: 3mm 2mm 3mm 2mm;
    break-inside: avoid;
    page-break-inside: avoid;
  }

  .card-header {
    display: flex;
    align-items: center;
    gap: 2.5mm;
    margin-bottom: 3mm;
  }

  .card-icon {
    width: 9mm;
    height: 9mm;
    border-radius: 50%;
    object-fit: cover;
    /* border: 1.5px solid var(--c, #8D6E63); */
    background: var(--c, #8D6E63);
    /* padding: 0.8mm; */
    flex-shrink: 0;
    align-self: start;
  }

  .card-header-text {
    flex: 1;
  }

  .card-title {
    font-size: 9.5pt;
    font-weight: 700;
    color: var(--c-text, #000000);
    background: var(--c, #8D6E63);
    padding: 1mm 3mm;
    border-radius: 3mm;
    letter-spacing: 2pt;
    text-transform: uppercase;
    line-height: 1.2;
    display: inline-block;
  }

  .card-subtitle {
    font-size: 9pt;
    color: #7B5A4A;
    letter-spacing: 0.3pt;
    font-style: italic;
    line-height: 1.3;
  }

  .card-subtitle-row {
    display: flex;
    align-items: center;
    /* gap: 1.5mm; */
    margin-top: 0.8mm;
    flex-wrap: wrap;
  }

  .chip {
    font-size: 10pt;
    font-weight: 600;
    color: var(--chip-c, #8D6E63);
    background: color-mix(in srgb, var(--chip-c, #8D6E63) 12%, transparent);
    padding: 0.3mm 2mm;
    border-radius: 3mm;
    letter-spacing: 0.1pt;
  }

  /* ── Item row ── */
  .item-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    min-height: 0;
  }

  .item-group {
    margin-bottom: 1.5mm;
    flex-grow: 1;
  }

  .item-group:last-child {
    margin-bottom: 0;
  }

  
  .item-name {
    font-size: 10pt;
    font-weight: 500;
    color: #000000;
    line-height: 1.3;
    text-transform: capitalize;
  }

  .item-price {
    font-size: 10pt;
    font-weight: 700;
    color: #2D1A0E;
    white-space: nowrap;
    flex-shrink: 0;
    align-self: baseline;
  }

  .item-left-icon {
    min-width: 16px;
    max-width: 16px;
    align-self: baseline;
  }

  .item-left-icon img, .tag-icon img {
    height: 0.9em;
    width: auto;
    vertical-align: baseline;
  }

  .item-left-icon img {
    margin-right: 0.5mm;
  }

  .item-layout {
    display: flex;
  }

  .tag-icons {
    display: inline-flex;
    align-items: center;
    gap: 0.5mm;
    margin-left: 1mm;
    vertical-align: middle;
  }

  .tag-icon {
    display: inline-flex;
    align-items: center;
  }


  .item-desc {
    font-size: 9pt;
    color: #8D6E63;
    font-style: italic;
    margin-top: 0.5mm;
    line-height: 1.35;
  }

  .item-note-ref {
    font-size: 0.6em;
    color: #8D6E63;
    margin-left: 0.3mm;
  }

  .item-note-ref span + span::before {
    content: ",";
  }


  /* ── Card photos ── */
  .menu-card {
    position: relative;
    overflow: visible;
    z-index: 0;
  }

  .card-content {
    display: block;
  }

  .card-items {
    width: 100%;
    gap: 2.5mm;
  display: flex;
  flex-direction: column;
  }

  .card-photo {
    position: absolute;
    top: -6mm;
    right: -3mm;
    width: 20mm;
    height: 20mm;
    /* border-radius: 50%; */
    object-fit: cover;
    border: none;
    box-shadow: none;
    z-index: 1;
  }

  /* ── Card notes ── */
  .card-note {
    text-align: left;
    margin-top: 3mm;
    font-size: 7pt;
    color: #8D6E63;
    letter-spacing: 0.5pt;
    font-weight: 500;
    line-height: 1.3;
  }

  .card-note sup {
    font-size: 0.7em;
  }

  .spice-icons {
    display: flex;
    justify-content: center;
    gap: 1mm;
    margin-top: 1.5mm;
    font-size: 8pt;
  }

  .page-note {
    display: flex;
    align-items: center;
    gap: 2mm;
    position: absolute;
    font-size: 10pt;
    color: black;
    font-weight: 400;
}

  .page-note-icon {
    height: 1.1em;
    width: auto;
  }

  /* ── Language toggle ── */
  .lang-toggle {
    position: fixed;
    top: 8mm;
    right: 8mm;
    z-index: 10;
    display: flex;
    gap: 2mm;
  }

  .lang-toggle button {
    font-family: "Nunito Sans", sans-serif;
    font-size: 14pt;
    font-weight: 700;
    padding: 2mm 5mm;
    border: 1.5px solid #8D6E63;
    border-radius: 6mm;
    background: #FCF5EE;
    color: #8D6E63;
    cursor: pointer;
  }

  .lang-toggle button.active {
    background: #8D6E63;
    color: #FCF5EE;
  }

  /* ── Color controls ── */
  .color-controls {
    position: fixed;
    top: 22mm;
    right: 8mm;
    z-index: 10;
    display: flex;
    flex-direction: column;
    gap: 2mm;
    background: #FCF5EE;
    border: 1.5px solid #8D6E63;
    border-radius: 6mm;
    padding: 2mm;
  }

  .color-controls button {
    font-family: "Nunito Sans", sans-serif;
    font-size: 10pt;
    font-weight: 700;
    padding: 1mm 3mm;
    border: 1.5px solid #8D6E63;
    border-radius: 4mm;
    background: #FCF5EE;
    color: #8D6E63;
    cursor: pointer;
  }

  .color-controls button.active {
    background: #8D6E63;
    color: #FCF5EE;
  }

  .ctrl-row {
    display: flex;
    align-items: center;
    gap: 1.5mm;
  }

  .ctrl-row label,
  .ctrl-row span {
    font-size: 8pt;
    font-weight: 600;
    color: #8D6E63;
    white-space: nowrap;
  }

  .ctrl-row input[type="color"] {
    width: 6mm;
    height: 6mm;
    border: 1px solid #8D6E63;
    border-radius: 2mm;
    padding: 0;
    cursor: pointer;
  }

  .ctrl-row input[type="range"] {
    width: 15mm;
    accent-color: #8D6E63;
  }



  @media print {
    .lang-toggle { display: none; }
    .color-controls { display: none; }
    html, body { background: transparent; margin: 0; padding: 0; }
    .page {
      width: 210mm;
      height: 297mm;
      margin: 0;
      background-size: 210mm 297mm;
      page-break-after: always;
    }
    .page + .page { margin-top: 0; }
    .page:last-child {
      page-break-after: auto;
    }
  }
</style>
</head>
<body>

<div class="lang-toggle">
  <button id="btn-fr" class="active" onclick="setLang('fr')">FR</button>
  <button id="btn-en" onclick="setLang('en')">EN</button>
</div>

<div class="color-controls" id="color-controls">
  <div class="ctrl-row">
    <button id="btn-bg-mix" class="active" onclick="setBgMode('mix')">Background color</button>
    <button id="btn-bg-unique" onclick="setBgMode('unique')">Background unique</button>
  </div>
  <div class="ctrl-row" id="mix-pct-row">
    <label>Mix %</label>
    <input type="range" id="mix-pct" min="0" max="50" value="5">
    <span id="mix-pct-val">5%</span>
  </div>
  <div class="ctrl-row" id="global-picker-row">
    <input type="color" id="base-color" value="#FCF5EE">
    <input type="range" id="base-opacity" min="0" max="100" value="80">
    <span id="base-opacity-val">80%</span>
  </div>
</div>

<script id="tpl-menu" type="text/x-handlebars-template">
{{#each pages}}
<div class="page">
  <div class="header">
    <img class="header-logo" src="images/logoImage.svg" alt="logo">
    <div class="header-center">
      <img class="header-name-img" src="images/logoText.svg" alt="HANBAOBAO">
      <span class="header-tagline">{{t ../tagline}}</span>
    </div>
  </div>

  <div class="columns">
    <div class="column">
      {{#each leftSections}}{{> card}}{{/each}}
    </div>
    <div class="column">
      {{#each rightSections}}{{> card}}{{/each}}
    </div>
  </div>

  {{#if pageNote}}
  <div class="page-note" style="{{#if pageNote.left}}left:{{pageNote.left}};{{/if}}{{#if pageNote.top}}top:{{pageNote.top}};{{/if}}">
    <img class="page-note-icon" src="{{pageNote.icon}}" alt="">
    <span>{{t pageNote.text}}</span>
  </div>
  {{/if}}

</div>
{{/each}}
</script>

<script id="tpl-card" type="text/x-handlebars-template">
<div class="menu-card" style="--c:{{color}};--c-text:{{cText}}" data-section="{{id}}">
  <div class="card-header">
    {{#if icon}}<img class="card-icon" src="{{icon}}" alt="">{{/if}}
    <div class="card-header-text">
      <div class="card-title">{{t title}} {{#if title.cn}}<span class="cn">{{title.cn}}</span>{{/if}} </div>
            {{#if subtitle}}
      <div class="card-subtitle-row">
        <span class="card-subtitle">{{t subtitle}}</span>
        {{#if chips}}
        {{#each chips}}
        <span class="chip" style="--chip-c:{{color}}">{{t this}}</span>
        {{/each}}
        {{/if}}
      </div>
      <div class="card-subtitle-row">
        <span class="card-subtitle cn">{{subtitle.cn}}</span>
        {{#if chips}}
        {{#each chips}}
        <span class="chip cn" style="--chip-c:{{color}}">{{this.cn}}</span>
        {{/each}}
        {{/if}}
      </div>
      {{else}}
      {{#if chips}}
      <div class="card-subtitle-row">
        {{#each chips}}
        <span class="chip" style="--chip-c:{{color}}">{{t this}}</span>
        {{/each}}
      </div>
      <div class="card-subtitle-row">
        {{#each chips}}
        <span class="chip cn" style="--chip-c:{{color}}">{{this.cn}}</span>
        {{/each}}
      </div>
      {{/if}}
      {{/if}}
    </div>
  </div>
  <div class="card-content">
    <div class="card-items">
      {{#each items}}
      <div class="item-layout">
      <div class="item-left-icon">{{#if (includes tags "favorite")}}<img src="images/item-icons/favorite.png" alt="">{{/if}}</div>
      <div class="item-group">
        
        <div class="item-name">{{t name}}{{#if noteNums}}<sup class="item-note-ref">{{#each noteNums}}<span>{{this}}</span>{{/each}}</sup>{{/if}}
            {{#if tags}}<span class="tag-icons">{{#each tags}}{{#unless (eq this "favorite")}}<span class="tag-icon"><img src="images/item-icons/{{this}}.png" alt="{{this}}"></span>{{/unless}}{{/each}}</span>{{/if}}
        </div>
        <div class="item-row">
          {{#if name.cn}}<div class="cn">{{name.cn}}</div>{{/if}}
          <div class="item-price">{{price}}&nbsp;€</div>
        </div>
        {{#if description}}<div class="item-desc">{{t description}}<br><span class="cn">{{description.cn}}</span></div>{{/if}}
      </div>
      </div>
      {{/each}}
    </div>
    {{#if notes}}
    {{#each notes}}
    <div class="card-note"><sup>{{num}}</sup> {{t text}}<br><span class="cn">{{text.cn}}</span></div>
    {{/each}}
    {{/if}}
    {{#if sectionImages}}
      {{#each sectionImages}}
      <img class="card-photo"
           src="{{src}}"
           alt=""
           style="{{#if top}}top:{{top}};{{/if}}{{#if bottom}}bottom:{{bottom}};{{/if}}{{#if right}}right:{{right}};{{/if}}{{#if left}}left:{{left}};{{/if}}{{#if size}}width:{{size}};height:{{size}};{{/if}}{{#if rotation}}transform:rotate({{rotation}});{{/if}}{{#if zIndex}}z-index:{{zIndex}};{{/if}}">
      {{/each}}
    {{/if}}
  </div>
</div>
</script>

<script>
(function() {
  var currentLang = 'fr';
  var menuData = null;

  Handlebars.registerHelper('t', function(obj) {
    if (typeof obj === 'string') return obj;
    if (!obj) return '';
    return obj[currentLang] || obj.fr || obj.en || '';
  });

  Handlebars.registerHelper('includes', function(arr, val) {
    return arr && arr.includes(val);
  });

  Handlebars.registerHelper('eq', function(a, b) {
    return a === b;
  });

  Handlebars.registerPartial('card', document.getElementById('tpl-card').innerHTML);
  function contrastColor(hex) {
    var c = hex.replace('#', '');
    var r = parseInt(c.substring(0, 2), 16);
    var g = parseInt(c.substring(2, 4), 16);
    var b = parseInt(c.substring(4, 6), 16);
    var lum = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
    return lum > 0.55 ? '#000000' : '#FFFFFF';
  }

  var tpl = Handlebars.compile(document.getElementById('tpl-menu').innerHTML);

  // ── Color control state ──
  /* defaults: bgMode='mix' mixPct=5 color=#FCF5EE opacity=80 */
  var bgMode = 'mix';
  var mixPct = 5;
  var globalColor = '#FCF5EE';
  var globalOpacity = 80;

  function toHex2(n) {
    return Math.round(n).toString(16).padStart(2, '0');
  }

  function getBaseColorHex() {
    return globalColor + toHex2(globalOpacity * 2.55);
  }

  function applyCardBackgrounds() {
    var cards = document.querySelectorAll('.menu-card');
    var baseHex = getBaseColorHex();
    var bgColor;
    if (bgMode === 'mix') {
      bgColor = 'color-mix(in srgb, var(--c) ' + mixPct + '%, ' + baseHex + ')';
    } else {
      bgColor = baseHex;
    }
    cards.forEach(function(card) {
      card.style.setProperty('--card-bg', bgColor);
    });
  }

  window.setBgMode = function(mode) {
    bgMode = mode;
    document.getElementById('btn-bg-mix').className = mode === 'mix' ? 'active' : '';
    document.getElementById('btn-bg-unique').className = mode === 'unique' ? 'active' : '';
    document.getElementById('mix-pct-row').style.display = mode === 'mix' ? 'flex' : 'none';
    applyCardBackgrounds();
  };

  document.getElementById('base-color').addEventListener('input', function() {
    globalColor = this.value;
    applyCardBackgrounds();
  });

  document.getElementById('base-opacity').addEventListener('input', function() {
    globalOpacity = parseInt(this.value);
    document.getElementById('base-opacity-val').textContent = this.value + '%';
    applyCardBackgrounds();
  });

  document.getElementById('mix-pct').addEventListener('input', function() {
    mixPct = parseInt(this.value);
    document.getElementById('mix-pct-val').textContent = this.value + '%';
    applyCardBackgrounds();
  });

  function render() {
    var byPage = {};
    Object.keys(menuData.sections).forEach(function(key) {
      var s = Object.assign({ id: key }, menuData.sections[key]);
      s.cText = contrastColor(s.color || '#8D6E63');
      var noteNum = 0;
      s.notes = [];
      if (s.items) s.items.forEach(function(item) { item.noteNums = []; });
      if (menuData.notes) {
        // section-level notes → auto-apply to all items
        if (s.sectionNotes && s.items) {
          s.sectionNotes.forEach(function(id) {
            if (menuData.notes[id]) {
              noteNum++;
              s.notes.push({ num: noteNum, text: menuData.notes[id] });
              s.items.forEach(function(item) {
                item.noteNums.push(noteNum);
              });
            }
          });
        }
        // item-level notes
        if (s.items) {
          s.items.forEach(function(item) {
            if (item.note && menuData.notes[item.note]) {
              noteNum++;
              item.noteNums.push(noteNum);
              s.notes.push({ num: noteNum, text: menuData.notes[item.note] });
            }
          });
        }
      }
      delete s.sectionNotes;
      var p = s.page || 1;
      if (!byPage[p]) byPage[p] = [];
      byPage[p].push(s);
    });
    var pages = Object.keys(byPage).map(Number).sort().map(function(p) {
      var left = [], right = [];
      byPage[p].forEach(function(s) {
        (s.column === 2 ? right : left).push(s);
      });
      left.sort(function(a, b) { return (a.rank || 0) - (b.rank || 0); });
      right.sort(function(a, b) { return (a.rank || 0) - (b.rank || 0); });
      return { leftSections: left, rightSections: right, pageNote: menuData.pageNotes && menuData.pageNotes[p] || null };
    });
    document.getElementById('menu-output').innerHTML = tpl({
      pages: pages,
      tagline: menuData.tagline
    });
    applyCardBackgrounds();
  }

  window.setLang = function(lang) {
    currentLang = lang;
    document.getElementById('btn-fr').className = lang === 'fr' ? 'active' : '';
    document.getElementById('btn-en').className = lang === 'en' ? 'active' : '';
    document.title = 'Hanbaobao' + (lang === 'en' ? 'En' : 'Fr');
    render();
  };

  fetch('menu.json')
    .then(function(r) { return r.json(); })
    .then(function(data) { menuData = data; render(); });
})();
</script>

<div id="menu-output"></div>


</body>
</html>
