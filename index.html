<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Hanbaobao — Menu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/handlebars@4.7.8/dist/handlebars.min.js"></script>
<style>
  @page {
    size: A4;
    margin: 0;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    background: #f5ede3;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  body {
    font-family: "Nunito Sans", sans-serif;
    color: #2D1A0E;
  }

  /* ── Reference panel (screen only) ── */
  .ref-toggle {
    position: fixed;
    bottom: 4mm;
    right: 4mm;
    z-index: 200;
    background: #5D4037;
    color: #fff;
    border: none;
    border-radius: 3mm;
    font-family: "Poppins", sans-serif;
    font-size: 8pt;
    font-weight: 600;
    padding: 2mm 4mm;
    cursor: pointer;
    box-shadow: 0 2px 6px rgba(0,0,0,.25);
  }

  .ref-panel {
    position: fixed;
    top: 0;
    right: 0;
    width: 50vw;
    height: 100vh;
    background: #222;
    z-index: 150;
    overflow-y: auto;
    display: none;
    box-shadow: -4px 0 16px rgba(0,0,0,.4);
  }

  .ref-panel.open { display: block; }

  .ref-panel img {
    width: 100%;
    display: block;
  }

  @media print {
    .ref-toggle, .ref-panel { display: none !important; }
  }

  /* ── Page ── */
  .page {
    width: 210mm;
    min-height: 297mm;
    margin: 0 auto;
    padding: 7mm 7mm 6mm;
    background-image: url('images/bg.png');
    background-size: 210mm 297mm;
    background-repeat: no-repeat;
    background-position: top left;
  }

  .page + .page {
    margin-top: 8mm;
  }

  /* ── Header ── */
  .header {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4mm;
    margin-bottom: 5mm;
    padding-bottom: 3.5mm;
  }

  .header-logo {
    height: 2cm;
    width: auto;
    object-fit: contain;
  }

  .header-center {
    text-align: center;
  }

  .header-name-img {
    width: 5cm;
    object-fit: contain;
    display: block;
    margin: 0 auto;
  }

  .header-chinese {
    font-size: 10.5pt;
    font-weight: 700;
    color: #1A2C5B;
    letter-spacing: 5pt;
    display: block;
    margin-top: 0.5mm;
  }

  .header-title {
    font-family: "Dancing Script", cursive;
    font-size: 30pt;
    color: #1A2C5B;
    line-height: 1;
    margin-top: 1mm;
  }

  .header-tagline {
    font-size: 10pt;
    color: #7B5A4A;
    letter-spacing: 3pt;
    font-weight: 500;
    margin-top: 1.5mm;
    display: block;
  }

  /* ── Columns ── */
  .columns {
    display: flex;
    gap: 5mm;
    align-items: flex-start;
  }

  .column {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 4mm;
  }

  /* ── Card ── */
  .menu-card {
    border-radius: 32px;
    border: 1.5px solid var(--c, #8D6E63);
    background: #FCF5EECC;
    padding: 3mm 3.5mm 3.5mm;
    break-inside: avoid;
    page-break-inside: avoid;
    margin-top: 5mm;
  }

  .card-header {
    display: flex;
    align-items: center;
    gap: 2.5mm;
    margin-bottom: 3mm;
  }

  .card-icon {
    width: 9mm;
    height: 9mm;
    border-radius: 50%;
    object-fit: cover;
    /* border: 1.5px solid var(--c, #8D6E63); */
    background: var(--c, #8D6E63);
    /* padding: 0.8mm; */
    flex-shrink: 0;
  }

  .card-header-text {
    flex: 1;
  }

  .card-title {
    font-size: 9.5pt;
    font-weight: 700;
    color: var(--c, #8D6E63);
    letter-spacing: 2pt;
    text-transform: uppercase;
    line-height: 1.2;
  }

  .card-title-cn {
    font-size: 8.5pt;
    font-weight: 600;
    color: var(--c, #8D6E63);
    letter-spacing: 1pt;
    line-height: 1.2;
    margin-top: 0.3mm;
  }

  .card-subtitle {
    font-size: 9pt;
    color: #7B5A4A;
    letter-spacing: 0.3pt;
    font-style: italic;
    line-height: 1.3;
  }

  .card-subtitle-cn {
    font-size: 8pt;
    color: #7B5A4A;
    letter-spacing: 0.2pt;
    font-style: italic;
    line-height: 1.3;
  }

  .chip-cn {
    font-size: 8.5pt;
  }

  .card-subtitle-row {
    display: flex;
    align-items: center;
    /* gap: 1.5mm; */
    margin-top: 0.8mm;
    flex-wrap: wrap;
  }

  .chip {
    font-size: 10pt;
    font-weight: 600;
    color: var(--chip-c, #8D6E63);
    background: color-mix(in srgb, var(--chip-c, #8D6E63) 12%, transparent);
    padding: 0.3mm 2mm;
    border-radius: 3mm;
    letter-spacing: 0.1pt;
  }

  /* ── Item row ── */
  .item-row {
    display: flex;
    align-items: baseline;
    gap: 2mm;
    min-height: 0;
  }

  .item-group {
    margin-bottom: 2.5mm;
  }

  .item-group:last-child {
    margin-bottom: 0;
  }

  .item-name {
    font-size: 10pt;
    font-weight: 600;
    color: #2D1A0E;
    letter-spacing: 0.3pt;
    line-height: 1.3;
    flex-shrink: 0;
    max-width: 75%;
    text-transform: capitalize;
  }

  .item-name-cn {
    font-size: 8.5pt;
    font-weight: 500;
    color: #8D6E63;
    line-height: 1.3;
    margin-top: 0.2mm;
  }

  .item-dots {
    flex: 1;
    min-width: 3mm;
    position: relative;
    align-self: stretch;
  }

  .item-dots::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    border-bottom: 1.5px dotted #BBA99A;
    margin-bottom: 2px;
  }

  .item-price {
    font-size: 10pt;
    font-weight: 700;
    color: #2D1A0E;
    white-space: nowrap;
    flex-shrink: 0;
    align-self: flex-end;
  }

  .item-desc {
    font-size: 9pt;
    color: #8D6E63;
    font-style: italic;
    margin-top: 0.5mm;
    line-height: 1.35;
  }

  .desc-cn {
    font-size: 8pt;
  }

  /* ── Card photos ── */
  .menu-card {
    position: relative;
    overflow: visible;
    z-index: 0;
  }

  .card-content {
    display: block;
  }

  .card-items {
    width: 100%;
  }

  .card-photo {
    position: absolute;
    top: -6mm;
    right: -3mm;
    width: 20mm;
    height: 20mm;
    border-radius: 50%;
    object-fit: cover;
    border: none;
    box-shadow: none;
    z-index: 1;
  }

  /* ── Spice note ── */
  .spice-note {
    text-align: center;
    margin-top: 5mm;
    font-size: 8pt;
    color: #C02C2C;
    letter-spacing: 1pt;
    font-weight: 500;
  }

  .spice-icons {
    display: flex;
    justify-content: center;
    gap: 1mm;
    margin-top: 1.5mm;
    font-size: 8pt;
  }

  @media print {
    html, body { background: transparent; margin: 0; padding: 0; }
    .page {
      width: 210mm;
      height: 297mm;
      margin: 0;
      background-size: 210mm 297mm;
      page-break-after: always;
    }
    .page + .page { margin-top: 0; }
    .page:last-child {
      page-break-after: auto;
    }
  }
</style>
</head>
<body>

<script id="tpl-menu" type="text/x-handlebars-template">
{{#each pages}}
<div class="page">
  <div class="header">
    <img class="header-logo" src="images/logoImage.svg" alt="logo">
    <div class="header-center">
      <img class="header-name-img" src="images/logoText.svg" alt="HANBAOBAO">
      <span class="header-tagline">{{../tagline.fr}} · {{../tagline.cn}}</span>
    </div>
  </div>

  <div class="columns">
    <div class="column">
      {{#each leftSections}}{{> card}}{{/each}}
    </div>
    <div class="column">
      {{#each rightSections}}{{> card}}{{/each}}
    </div>
  </div>

</div>
{{/each}}
</script>

<script id="tpl-card" type="text/x-handlebars-template">
<div class="menu-card" style="--c:{{color}}">
  <div class="card-header">
    {{#if icon}}<img class="card-icon" src="{{icon}}" alt="">{{/if}}
    <div class="card-header-text">
      <div class="card-title">{{title.fr}}</div>
      {{#if title.cn}}<div class="card-title-cn">{{title.cn}}</div>{{/if}}
      {{#if subtitle}}
      <div class="card-subtitle-row">
        <span class="card-subtitle">{{subtitle.fr}}</span>
        {{#if chips}}
        {{#each chips}}
        <span class="chip" style="--chip-c:{{color}}">{{this.fr}}</span>
        {{/each}}
        {{/if}}
      </div>
      <div class="card-subtitle-row">
        <span class="card-subtitle card-subtitle-cn">{{subtitle.cn}}</span>
        {{#if chips}}
        {{#each chips}}
        <span class="chip chip-cn" style="--chip-c:{{color}}">{{this.cn}}</span>
        {{/each}}
        {{/if}}
      </div>
      {{else}}
      {{#if chips}}
      <div class="card-subtitle-row">
        {{#each chips}}
        <span class="chip" style="--chip-c:{{color}}">{{this.fr}}</span>
        {{/each}}
      </div>
      <div class="card-subtitle-row">
        {{#each chips}}
        <span class="chip chip-cn" style="--chip-c:{{color}}">{{this.cn}}</span>
        {{/each}}
      </div>
      {{/if}}
      {{/if}}
    </div>
  </div>
  <div class="card-content">
    <div class="card-items">
      {{#each items}}
      <div class="item-group">
        <div class="item-row">
          <div class="item-name">{{name.fr}}</div>
          <div class="item-dots"></div>
          <div class="item-price">{{price}}&nbsp;€</div>
        </div>
        {{#if name.cn}}<div class="item-name-cn">{{name.cn}}</div>{{/if}}
        {{#if description}}<div class="item-desc">{{description.fr}}<br><span class="desc-cn">{{description.cn}}</span></div>{{/if}}
      </div>
      {{/each}}
    </div>
    {{#if spiceNote}}
    <div class="spice-note">{{spiceNote.fr}}<br>{{spiceNote.cn}}</div>
    {{/if}}
    {{#if sectionImages}}
      {{#each sectionImages}}
      <img class="card-photo"
           src="{{src}}"
           alt=""
           style="{{#if top}}top:{{top}};{{/if}}{{#if bottom}}bottom:{{bottom}};{{/if}}{{#if right}}right:{{right}};{{/if}}{{#if left}}left:{{left}};{{/if}}{{#if size}}width:{{size}};height:{{size}};{{/if}}{{#if rotation}}transform:rotate({{rotation}});{{/if}}{{#if zIndex}}z-index:{{zIndex}};{{/if}}">
      {{/each}}
    {{/if}}
  </div>
</div>
</script>

<script>
(function() {
  Handlebars.registerPartial('card', document.getElementById('tpl-card').innerHTML);
  var tpl = Handlebars.compile(document.getElementById('tpl-menu').innerHTML);

  function render(menuData) {
    var byPage = {};
    Object.keys(menuData.sections).forEach(function(key) {
      var s = Object.assign({ id: key }, menuData.sections[key]);
      if (s.isSpicy) s.spiceNote = menuData.spiceNote;
      var p = s.page || 1;
      if (!byPage[p]) byPage[p] = [];
      byPage[p].push(s);
    });
    var pages = Object.keys(byPage).map(Number).sort().map(function(p) {
      var left = [], right = [];
      byPage[p].forEach(function(s) {
        (s.column === 2 ? right : left).push(s);
      });
      left.sort(function(a, b) { return (a.rank || 0) - (b.rank || 0); });
      right.sort(function(a, b) { return (a.rank || 0) - (b.rank || 0); });
      return { leftSections: left, rightSections: right };
    });
    document.getElementById('menu-output').innerHTML = tpl({
      pages: pages,
      tagline: menuData.tagline
    });
  }

  fetch('menu.json')
    .then(function(r) { return r.json(); })
    .then(render);
})();
</script>

<div id="menu-output"></div>

<div class="ref-panel" id="ref-panel">
  <img src="ex2.png" alt="Reference">
</div>
<button class="ref-toggle" onclick="document.getElementById('ref-panel').classList.toggle('open')">
  👁 Référence
</button>
</body>
</html>
